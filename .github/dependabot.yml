version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    groups:
      minor-update:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      major-update:
        patterns:
          - "*"
        update-types:
          - "major"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      minor-update:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      major-update:
        patterns:
          - "*"
        update-types:
          - "major"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    groups:
      minor-update:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      major-update:
        patterns:
          - "*"
        update-types:
          - "major"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"